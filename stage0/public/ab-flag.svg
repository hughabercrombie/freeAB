<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-label="Flag of Alberta">
  <!-- Simplified Alberta flag: blue field + provincial shield -->
  <rect width="600" height="300" fill="#0072C6"/>
  <g transform="translate(300 150)">
    <!-- Shield -->
    <path d="M-70,-95 L70,-95 L70,35 Q70,95 0,115 Q-70,95 -70,35 Z" fill="#F4EFE4" stroke="#1c2430" stroke-width="4"/>
    <!-- Cross of St George -->
    <rect x="-70" y="-95" width="140" height="28" fill="#C8102E"/>
    <rect x="-14" y="-95" width="28" height="28" fill="#F4EFE4"/>
    <rect x="-70" y="-81" width="140" height="8" fill="#F4EFE4" opacity="0"/>
    <!-- sky / mountains band -->
    <rect x="-62" y="-62" width="124" height="48" fill="#7EB6E0"/>
    <path d="M-62,-30 L-35,-55 L-10,-38 L15,-58 L40,-34 L62,-52 L62,-14 L-62,-14 Z" fill="#5B6570"/>
    <path d="M-50,-30 L-35,-48 L-20,-32 L0,-50 L20,-30 L35,-45 L50,-28 L50,-14 L-50,-14 Z" fill="#F4EFE4"/>
    <!-- prairie -->
    <rect x="-62" y="-14" width="124" height="36" fill="#2F80ED"/>
    <rect x="-62" y="22" width="124" height="40" fill="#C4A35A"/>
    <path d="M-62,55 Q-30,35 0,55 Q30,35 62,55 L62,70 Q30,95 0,100 Q-30,95 -62,70 Z" fill="#1B7A4A"/>
    <!-- wheat stalks (simple) -->
    <g fill="#F2D27A" stroke="#8A6A1F" stroke-width="1">
      <path d="M-28,20 C-28,5 -20,-5 -20,20"/>
      <ellipse cx="-20" cy="0" rx="5" ry="10"/>
      <path d="M0,22 C0,6 8,-4 8,22"/>
      <ellipse cx="8" cy="2" rx="5" ry="10"/>
      <path d="M28,20 C28,5 36,-5 36,20"/>
      <ellipse cx="36" cy="0" rx="5" ry="10"/>
    </g>
  </g>
</svg>
